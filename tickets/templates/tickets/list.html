
{% extends "tickets/base.html" %}
{% block content %}
<h2>My incident tickets</h2>
<p><a class="btn" href="/tickets/new/">+ New ticket</a></p>

<table>
  <tr><th>#</th><th>Title</th><th>Severity</th><th>Actions</th></tr>
  {% for t in tickets %}
  <tr>
    <td>{{ t.pk }}</td>
    <td>{{ t.title }}</td>
    <td class="sev-{{ t.severity }}">{{ t.get_severity_display }}</td>
    <td>
      <form method="post" action="{% url 'ticket_delete' t.pk %}">
        {% csrf_token %}
        <button type="submit">Delete</button>
      </form>
    </td>
  </tr>
  {% empty %}
  <tr><td colspan="4">No tickets yet.</td></tr>
  {% endfor %}
</table>
{% endblock %}
